[tox]
envlist =
    lint,
    py312,

[testenv]
runner = uv-venv-lock-runner
uv_python_preference = only-managed
uv_sync_flags = --all-extras
dependency_groups = test
passenv = UV_LINK_MODE
setenv =
    COVERAGE_FILE = .coverage_db_{envname}
commands =
    pytest \
      --color=yes \
      --cov=rimrule \
      --cov-report html:htmlcov_{envname} \
      --cov-report term \
      --cov-report xml:coverage_{envname}.xml

[testenv:lint]
dependency_groups = dev, test
commands =
    ruff check .
    ruff format --check .
    mypy .
