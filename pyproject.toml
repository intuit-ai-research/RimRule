[project]
name = "rimrule"
version = "0.1.0a0"
description = "MDL-guided rule learning for tool-using agents"
authors = []
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["rule-learning", "mdl", "llm-agents", "tool-use", "toolhop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# https://docs.astral.sh/uv/concepts/projects/dependencies/
dependencies = [
    "langchain >=1.2",
    "langchain-openai >=1.1",
    "langchain-community >=0.4",
    "pydantic >=2.7",
    "PyYAML >=6.0",
    "typer >=0.12",
    "tqdm >=4.66",
]

[project.urls]
Homepage = "https://github.com/intuit-ai-research/RimRule"
Repository = "https://github.com/intuit-ai-research/RimRule"
Issues = "https://github.com/intuit-ai-research/RimRule/issues"

[project.optional-dependencies]
test = [
    "pytest >=8.4.0",
    "pytest-cov >=7.0.0,<8.0.0",
    "pytest-xdist >=3.8.0,<4.0.0",
]
dev = [
    "ruff >=0.9.0",
    "mypy >=1.18.1,<2.0.0",
    "pre-commit >=4.0.0",
    "types-PyYAML >=6.0",
    "types-tqdm >=4.66",
]
seccomp = [
    "pyseccomp >=0.1.2 ; sys_platform == 'linux'",
]

[project.scripts]
rimrule = "scripts.cli:app"

[dependency-groups]
test = [
    "pytest >=8.4.0",
    "pytest-cov >=7.0.0,<8.0.0",
    "pytest-xdist >=3.8.0,<4.0.0",
    "tox >=4.26.0,<5.0.0",
    "tox-uv >=1.28.0",
]
dev = [
    "ruff >=0.9.0",
    "mypy >=1.18.1,<2.0.0",
    "pre-commit >=4.0.0",
    "types-PyYAML >=6.0",
    "types-tqdm >=4.66",
]

[tool.uv.build-backend]
module-name = ["rimrule", "scripts"]
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", ".tox", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/cli.py" = ["B008"]
"rimrule/induction/prompts.py" = ["E501"]
"rimrule/toolhop/agent.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rimrule", "scripts"]

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["seccomp", "pyseccomp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = [
    "tests",
]
looponfailroots = ["rimrule", "tests"]
addopts = "-p no:warnings -o log_cli=true -o log_cli_level=INFO -m 'not e2e'"
markers = [
    "integration: tests that touch multiple components",
    "e2e: end-to-end tests against real services",
    "allow_network: tests permitted to make network calls",
]

[tool.coverage.run]
source = ["rimrule"]
omit = [
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"
